openapi: 3.1.0
info:
  title: Synthetic Demo API
  version: 1.0.0
  description: Non-production contract used to demonstrate catalog discovery.
servers:
  - url: https://api.example.test
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read service health
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /echo:
    post:
      operationId: createEcho
      summary: Echo a message
      tags: [examples]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Echoed payload
